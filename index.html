<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/ventureforge_logo_icon.png" />
    <title>VentureForge — AI Venture Research</title>
    <meta name="description" content="VentureForge: A 14-step AI-powered venture research pipeline. From trend detection to pitch deck in one automated workflow." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              studio: {
                50: '#f2fcf5',
                100: '#e1f8e8',
                200: '#c3eed0',
                300: '#96deb0',
                400: '#62c58a',
                500: '#3ba568',
                600: '#2b8551',
                700: '#246a43',
                800: '#205438',
                900: '#1b4530',
                950: '#0d261a',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f8fafc;
      }
      /* Scrollbar styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

      /* Markdown Prose Styles (reduced ~15% from base) */
      .prose { font-size: 0.84rem; }
      .prose h1 { font-size: 1.2rem; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.4em; }
      .prose h2 { font-size: 1rem; font-weight: 600; margin-top: 1.3em; margin-bottom: 0.4em; color: #1f2937; }
      .prose h3 { font-size: 0.88rem; font-weight: 600; margin-top: 1em; margin-bottom: 0.4em; color: #374151; }
      .prose p { margin-bottom: 0.8em; line-height: 1.65; color: #4b5563; }
      .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.9em; }
      .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 0.9em; }
      .prose li { margin-bottom: 0.25em; color: #4b5563; line-height: 1.55; }
      .prose strong { font-weight: 600; color: #1f2937; }
      .prose em { font-style: italic; }
      .prose code { font-family: 'JetBrains Mono', monospace; font-size: 0.82em; background: #f3f4f6; padding: 0.15em 0.4em; border-radius: 4px; color: #374151; }
      .prose pre { background: #1f2937; color: #e5e7eb; padding: 1em; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; }
      .prose pre code { background: none; color: inherit; padding: 0; }
      .prose blockquote { border-left: 3px solid #2b8551; padding: 0.6em 0.9em; font-style: italic; color: #6b7280; margin: 1em 0; background: #f9fafb; border-radius: 0 6px 6px 0; font-size: 0.82rem; }
      
      /* Table Styles */
      .prose table { width: 100%; border-collapse: collapse; margin-bottom: 1.3em; font-size: 0.82em; }
      .prose th { background-color: #f9fafb; font-weight: 600; text-align: left; padding: 0.5rem 0.65rem; border: 1px solid #e5e7eb; color: #374151; }
      .prose td { padding: 0.5rem 0.65rem; border: 1px solid #e5e7eb; color: #4b5563; }
      .prose tr:nth-child(even) td { background-color: #f9fafb; }
      .prose a { color: #2b8551; text-decoration: underline; }
      .prose a:hover { color: #246a43; }

      /* Prose sm for chat */
      .prose-sm h1 { font-size: 0.88rem; }
      .prose-sm h2 { font-size: 0.82rem; }
      .prose-sm p { font-size: 0.78rem; margin-bottom: 0.5em; }
      .prose-sm li { font-size: 0.78rem; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
